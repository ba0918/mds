# mds の仕様 IR の検査の設定（kotowari）
ir: docs/ir
decisions:
  records: docs/decision/records
  adr: docs/decision/adr
tests:
  files:
    - "src/**/*.rs"
    - "tests/**/*.rs"
    - "crates/**/*.rs"
  rust:
    attributes: []
    macros: [proptest]
limits:
  lines: 200
  requirements: 10
vague_words:
  - "適切に"
  - "必要に応じて"
  - "通常は"
  - "など"
