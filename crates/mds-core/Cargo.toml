[package]
name = "mds-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["markdown", "schema", "validation"]
categories = ["text-processing", "parser-implementations"]
description = "Schema language, validation, and extraction for mds"

[dependencies]
markdown = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
gray_matter = { version = "0.3", features = ["yaml"] }
regex = "1"
serde-saphyr = "1"

[dev-dependencies]
proptest = "1"
