[package]
name = "mds"
version = "0.1.0"
edition = "2021"
description = "Validate Markdown documents against a YAML schema declared in their frontmatter and extract structured values"

[dependencies]
mds-core = { path = "crates/mds-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace]
members = ["crates/mds-core"]
resolver = "2"